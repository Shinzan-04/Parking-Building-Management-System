<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Test — Parking System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }
    h1 {
      font-size: 1.6rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media(max-width:860px){ .grid{ grid-template-columns:1fr; } }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }
    .card h2 {
      font-size: 1rem;
      color: #7dd3fc;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 0.7rem;
      background: #0ea5e9;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
    }

    label { display: block; font-size: 0.82rem; color: #94a3b8; margin-bottom: 4px; margin-top: 12px; }
    input, select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 9px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #38bdf8; }

    button {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #0ea5e9; color: white; }
    .btn-success { background: #22c55e; color: white; }
    .btn-danger  { background: #ef4444; color: white; }
    .btn-warning { background: #f59e0b; color: #0f172a; }
    .btn-secondary { background: #334155; color: #e2e8f0; }

    .log {
      background: #0f172a;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      min-height: 80px;
      max-height: 260px;
      overflow-y: auto;
      font-size: 0.82rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log .ok   { color: #4ade80; }
    .log .err  { color: #f87171; }
    .log .info { color: #93c5fd; }
    .log .warn { color: #fbbf24; }

    .payos-box {
      display: none;
      margin-top: 16px;
      background: #0f2a1e;
      border: 1px solid #22c55e;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .payos-box.visible { display: block; }
    .payos-box h3 { color: #4ade80; margin-bottom: 8px; }
    .payos-box .fee {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fbbf24;
      margin: 8px 0;
    }
    .payos-box a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 28px;
      background: #22c55e;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
    }
    .payos-box .order-code { color: #64748b; font-size: 0.8rem; margin-top: 8px; }

    .reservation-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      font-size: 0.82rem;
    }
    .reservation-card .slot { color: #38bdf8; font-weight: 700; font-size: 1rem; }
    .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-PaymentPending { background: #78350f; color: #fcd34d; }
    .status-PendingReview  { background: #1e3a5f; color: #93c5fd; }
    .status-Confirmed      { background: #14532d; color: #4ade80; }
    .status-Cancelled      { background: #3b1f1f; color: #f87171; }
    .status-Rejected       { background: #3b1f1f; color: #f87171; }
    .status-CheckedIn      { background: #134e4a; color: #34d399; }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
      transition: all 0.2s;
    }
    .tab.active { background: #0ea5e9; color: white; border-color: #0ea5e9; }

    .full { grid-column: 1 / -1; }
    hr { border: none; border-top: 1px solid #334155; margin: 12px 0; }
  </style>
</head>
<body>

<h1>🅿️ Booking & Payment Test</h1>
<p class="subtitle">Test flow: Đăng nhập → Tạo Booking → Thanh toán PayOS → Xác nhận</p>

<div class="grid">

  <!-- BƯỚC 1: ĐĂNG NHẬP -->
  <div class="card">
    <h2>1️⃣ Đăng nhập <span class="badge">Auth</span></h2>
    <label>Username</label>
    <input id="username" value="driver01" />
    <label>Password</label>
    <input id="password" type="password" value="123456" />
    <button class="btn-primary" onclick="login()">🔑 Đăng nhập</button>
    <div class="log" id="log-auth">Chưa đăng nhập...</div>
  </div>

  <!-- BƯỚC 2: LẤY DANH SÁCH XE / SLOT -->
  <div class="card">
    <h2>2️⃣ Chọn xe & slot <span class="badge">Data</span></h2>
    <label>Chọn xe của bạn</label>
    <select id="vehicleId">
      <option value="">-- Tải danh sách xe --</option>
    </select>
    <label>Chọn Slot (thủ công)</label>
    <select id="slotId">
      <option value="">-- Tải danh sách slot --</option>
    </select>
    <button class="btn-secondary" onclick="loadVehiclesAndSlots()">🔄 Tải xe & slot</button>
    <label>Thời gian bắt đầu</label>
    <input id="startTime" type="datetime-local" />
    <label>Thời gian kết thúc</label>
    <input id="endTime" type="datetime-local" />
    <div class="log" id="log-data" style="min-height:40px;"></div>
  </div>

  <!-- BƯỚC 3: TẠO BOOKING -->
  <div class="card">
    <h2>3️⃣ Tạo Booking <span class="badge">POST /api/reservations</span></h2>
    <label>Phương thức đặt chỗ</label>
    <select id="bookingMethod">
      <option value="0">Manual (tự chọn slot)</option>
      <option value="1">AI Recommended</option>
    </select>
    <button class="btn-primary" onclick="createBooking()">📅 Tạo Booking</button>

    <!-- NẠP TIỀN & SỐ DƯ VÍ -->
    <div class="wallet-box" id="wallet-box" style="margin-top:16px; background:#0f2a1e; padding:16px; border:1px solid #22c55e; border-radius:8px;">
      <h3 style="color:#fcd34d;">💰 Ví Tài Xế</h3>
      <div style="font-size:1.6rem; font-weight:bold; color:#4ade80; margin:8px 0;" id="wallet-balance">... VND</div>
      <button class="btn-success" onclick="topupWallet()">➕ Nạp 50,000 VND qua PayOS</button>
      <div id="topup-link-container" style="margin-top:12px; display:none;">
        <a id="topup-link" href="#" target="_blank" style="display:inline-block; padding:8px 16px; background:#22c55e; color:white; text-decoration:none; border-radius:6px; font-weight:bold;">🔗 Mở trang Nạp tiền PayOS</a>
      </div>
    </div>

    <div class="log" id="log-booking">Chưa tạo booking...</div>
  </div>

  <!-- BƯỚC 4: DANH SÁCH BOOKING CỦA TÔI -->
  <div class="card">
    <h2>4️⃣ Booking của tôi <span class="badge">GET</span></h2>
    <button class="btn-secondary" onclick="loadMyReservations()">🔄 Tải danh sách</button>
    <button class="btn-danger" style="margin-top:8px;" onclick="cancelSelectedReservation()">🚫 Hủy booking đã chọn</button>
    <div id="my-reservations" style="margin-top:12px;max-height:280px;overflow-y:auto;"></div>
    <div class="log" id="log-my" style="min-height:40px;"></div>
  </div>

</div>

<script>
const BASE = window.location.origin;
let token = localStorage.getItem('booking_test_token') || '';
let currentReservationId = null;
let selectedReservationId = null;

// ============================
// UTILS
// ============================
function setDefaultTimes() {
  const now = new Date();
  now.setMinutes(now.getMinutes() + 5);
  const end = new Date(now);
  end.setHours(end.getHours() + 3);
  document.getElementById('startTime').value = toLocalISO(now);
  document.getElementById('endTime').value = toLocalISO(end);
}

function toLocalISO(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function log(id, msg, type = 'info') {
  const el = document.getElementById(id);
  const line = document.createElement('span');
  line.className = type;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function clearLog(id) {
  document.getElementById(id).innerHTML = '';
}

async function apiFetch(path, method = 'GET', body = null) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(BASE + path, opts);
  const text = await res.text();
  try { return { ok: res.ok, status: res.status, data: JSON.parse(text) }; }
  catch { return { ok: res.ok, status: res.status, data: text }; }
}

// ============================
// BƯỚC 1: ĐĂNG NHẬP
// ============================
async function login() {
  clearLog('log-auth');
  log('log-auth', 'Đang đăng nhập...', 'info');
  const r = await apiFetch('/api/auth/login', 'POST', {
    username: document.getElementById('username').value,
    password: document.getElementById('password').value
  });
  if (r.ok && r.data.accessToken) {
    token = r.data.accessToken;
    localStorage.setItem('booking_test_token', token);
    const roleName = ['Admin','Manager','Staff','Driver'][r.data.role] || r.data.role;
    log('log-auth', `✅ Đăng nhập thành công!`, 'ok');
    log('log-auth', `👤 ${r.data.fullName} — Role: ${roleName}`, 'ok');
    log('log-auth', `📧 ${r.data.email}`, 'info');
    log('log-auth', `🪪 DriverCode: ${r.data.driverCode || 'N/A'}`, 'info');
    await loadVehiclesAndSlots();
    await loadWalletBalance();
  } else {
    log('log-auth', `❌ Lỗi: ${JSON.stringify(r.data?.message || r.data)}`, 'err');
  }
}

// ============================
// BƯỚC 2: TẢI XE & SLOT
// ============================
async function loadVehiclesAndSlots() {
  clearLog('log-data');
  // Tải xe
  const rv = await apiFetch('/api/vehicles/my-vehicles');
  const vSel = document.getElementById('vehicleId');
  vSel.innerHTML = '<option value="">-- Chọn xe --</option>';
  if (rv.ok && Array.isArray(rv.data)) {
    rv.data.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.dataset.vehicleTypeId = v.vehicleTypeId || '';
      opt.textContent = `${v.plateNumber} (${v.vehicleTypeName || v.vehicleType || 'N/A'})`;
      vSel.appendChild(opt);
    });
    log('log-data', `✅ Đã tải ${rv.data.length} xe`, 'ok');
  } else {
    log('log-data', `⚠️ Không tải được xe: ${JSON.stringify(rv.data?.message || rv.data)}`, 'warn');
  }

  // Tải slot — GET /api/parkingslots trả về tất cả slot
  const rs = await apiFetch('/api/parkingslots');
  const sSel = document.getElementById('slotId');
  sSel.innerHTML = '<option value="">-- Chọn slot --</option>';
  // API có thể trả array trực tiếp hoặc wrapper {items:[]}
  const slots = Array.isArray(rs.data) ? rs.data : (rs.data?.items || []);
  const available = slots.filter(s => s.status === 0 || s.status === 'Available');
  if (rs.ok && available.length > 0) {
    available.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      // field tên tầng có thể là floorName, floor.name, floor, floorIndex
      const floorLabel = s.floorName || s.floor?.name || s.floor || s.floorIndex || '?';
      opt.textContent = `${s.slotNumber} — Tầng ${floorLabel}`;
      opt.dataset.vehicleTypeId = s.vehicleTypeId || '';
      sSel.appendChild(opt);
    });
    log('log-data', `✅ Đã tải ${available.length} slot khả dụng (tổng: ${slots.length})`, 'ok');
  } else if (rs.ok) {
    log('log-data', `⚠️ Không có slot nào khả dụng`, 'warn');
  } else {
    log('log-data', `⚠️ Không tải được slot: ${JSON.stringify(rs.data?.message || rs.data)}`, 'warn');
  }
}

// ============================
// BƯỚC 3: TẠO BOOKING
// ============================
async function createBooking() {
  clearLog('log-booking');
  // document.getElementById('payos-box').classList.remove('visible');

  const vehicleId = document.getElementById('vehicleId').value;
  const slotId = document.getElementById('slotId').value;
  const method = parseInt(document.getElementById('bookingMethod').value);
  const startRaw = document.getElementById('startTime').value;
  const endRaw = document.getElementById('endTime').value;

  if (!vehicleId) { log('log-booking', '⚠️ Vui lòng chọn xe!', 'warn'); return; }
  if (method === 0 && !slotId) { log('log-booking', '⚠️ Chế độ Manual cần chọn slot!', 'warn'); return; }
  if (!startRaw || !endRaw) { log('log-booking', '⚠️ Vui lòng nhập thời gian!', 'warn'); return; }

  const body = {
    bookingMethod: method,
    vehicleId,
    parkingSlotId: slotId || null,
    startTime: new Date(startRaw).toISOString(),
    endTime: new Date(endRaw).toISOString()
  };

  log('log-booking', `📤 Gửi: ${JSON.stringify(body, null, 2)}`, 'info');

  const r = await apiFetch('/api/reservations', 'POST', body);

  if (r.ok) {
    const d = r.data;
    currentReservationId = d.id;
    log('log-booking', `✅ Booking tạo thành công! Tiền đã được trừ từ ví.`, 'ok');
    log('log-booking', `📋 Code: ${d.bookingCode}`, 'ok');
    log('log-booking', `🅿️ Slot: ${d.slotNumber}`, 'ok');
    log('log-booking', `💰 Phí đã trừ: ${(d.bookingFee || 0).toLocaleString('vi-VN')} VND`, 'info');
    log('log-booking', `📌 Status: ${d.status}`, 'info');

    // Cập nhật lại số dư
    await loadWalletBalance();
    await loadMyReservations();
  } else {
    log('log-booking', `❌ Lỗi: ${JSON.stringify(r.data)}`, 'err');
    if (r.status === 400 && JSON.stringify(r.data).includes("Số dư ví không đủ")) {
        alert("Số dư ví không đủ! Vui lòng bấm nạp tiền vào ví trước khi đặt chỗ.");
    }
  }
}

// ============================
// NẠP TIỀN VÀO VÍ (TOP-UP)
// ============================
async function loadWalletBalance() {
  const r = await apiFetch('/api/wallets/me');
  if (r.ok) {
    const balance = r.data.balance || 0;
    document.getElementById('wallet-balance').textContent = `${balance.toLocaleString('vi-VN')} VND`;
  }
}

async function topupWallet() {
  const r = await apiFetch('/api/wallets/deposit', 'POST', { amount: 50000 });
  if (r.ok) {
    document.getElementById('topup-link-container').style.display = 'block';
    document.getElementById('topup-link').href = r.data.checkoutUrl;
    alert("Đã tạo link nạp tiền! Bấm 'Mở trang Nạp tiền PayOS' để thanh toán.");
  } else {
    alert("Lỗi khi tạo nạp tiền: " + JSON.stringify(r.data));
  }
}

// ============================
// BƯỚC 4: DANH SÁCH BOOKING
// ============================
async function loadMyReservations() {
  clearLog('log-my');
  const r = await apiFetch('/api/reservations/my-reservations');
  const container = document.getElementById('my-reservations');
  container.innerHTML = '';
  if (r.ok && Array.isArray(r.data)) {
    if (r.data.length === 0) {
      container.innerHTML = '<p style="color:#64748b;font-size:0.85rem;margin-top:8px;">Chưa có booking nào.</p>';
      return;
    }
    r.data.forEach(rv => {
      const div = document.createElement('div');
      div.className = 'reservation-card';
      div.style.cursor = 'pointer';
      div.style.border = selectedReservationId === rv.id ? '1px solid #38bdf8' : '1px solid #334155';
      div.onclick = () => { selectedReservationId = rv.id; loadMyReservations(); };
      const statusLabels = {
        0: 'PaymentPending', 1: 'Paid', 2: 'PendingReview', 3: 'Confirmed',
        4: 'CheckedIn', 5: 'Completed', 6: 'Cancelled', 7: 'Rejected',
        8: 'NoShow', 9: 'PaymentFailed'
      };
      const statusText = typeof rv.status === 'number' ? statusLabels[rv.status] : rv.status;

      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="slot">🅿️ ${rv.slotNumber}</span>
          <span class="status-badge status-${statusText}">${statusText}</span>
        </div>
        <div style="margin-top:6px;color:#94a3b8">
          📋 <b>${rv.bookingCode}</b><br>
          🕐 ${new Date(rv.startTime).toLocaleString('vi-VN')} → ${new Date(rv.endTime).toLocaleString('vi-VN')}<br>
          🚗 ${rv.licensePlate}
          ${rv.bookingFee ? `<br>💰 Phí: <b style="color:#fbbf24">${rv.bookingFee.toLocaleString('vi-VN')} VND</b>` : ''}
          ${rv.rejectReason ? `<br>❌ Lý do từ chối: ${rv.rejectReason}` : ''}
        </div>`;
      container.appendChild(div);
    });
    log('log-my', `✅ Tải ${r.data.length} booking`, 'ok');
  } else {
    log('log-my', `❌ Lỗi: ${JSON.stringify(r.data)}`, 'err');
  }
}

async function cancelSelectedReservation() {
  if (!selectedReservationId) { alert('Chọn một booking để hủy!'); return; }
  if (!confirm('Bạn chắc chắn muốn hủy booking này?')) return;
  const r = await apiFetch(`/api/reservations/${selectedReservationId}/cancel`, 'PUT');
  if (r.ok) {
    log('log-my', '✅ Hủy booking thành công!', 'ok');
    selectedReservationId = null;
    await loadMyReservations();
  } else {
    log('log-my', `❌ Lỗi: ${JSON.stringify(r.data)}`, 'err');
  }
}

// ============================
// KHỞI TẠO
// ============================
setDefaultTimes();
if (token) {
  log('log-auth', `✅ Đã có token từ session trước. Click "Đăng nhập" để làm mới.`, 'ok');
}
</script>
</body>
</html>
